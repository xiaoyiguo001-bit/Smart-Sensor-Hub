<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Life | Smart Sensor Group</title>
    <style>
        :root { 
            --primary: #0f2c59; 
            --secondary: #1e88e5; 
            --accent: #00bcd4; 
            --bg: #f8fafc; 
            --text: #1e293b; 
            --muted: #64748b; 
        }
        
        * {
            box-sizing: border-box;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            margin: 0; 
            background: var(--bg); 
            color: var(--text); 
            line-height: 1.6; 
        }
        
        /* 导航栏样式（与其他页面完全一致） */
        .navbar { 
            background: var(--primary); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); 
        }
        .nav-container { 
            max-width: 1100px; 
            margin: 0 auto; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 20px; 
        }
        .nav-brand { 
            font-size: 1.2rem; 
            font-weight: bold; 
            color: white; 
            text-decoration: none; 
            padding: 16px 0; 
            white-space: nowrap;
        }
        .nav-brand span { color: var(--accent); }
        .nav-links { 
            display: flex; 
            gap: 2px; 
            list-style: none; 
            margin: 0; 
            padding: 0; 
        }
        .nav-links a { 
            color: #cbd5e1; 
            text-decoration: none; 
            padding: 18px 12px; 
            display: block; 
            font-weight: 500; 
            font-size: 0.95rem; 
            border-bottom: 3px solid transparent; 
            white-space: nowrap;
        }
        .nav-links a:hover { color: white; }
        .nav-links a.active { 
            color: white; 
            border-bottom-color: var(--accent); 
            background: rgba(255,255,255,0.08); 
        }

        .container { 
            max-width: 1100px; 
            margin: 30px auto; 
            padding: 0 20px; 
            min-height: 70vh; 
        }
        
        .section-title { 
            font-size: 1.5rem; 
            color: var(--primary); 
            border-left: 5px solid var(--secondary); 
            padding-left: 12px; 
            margin-bottom: 10px; 
            font-weight: 700; 
        }
        .section-subtitle { 
            color: var(--muted); 
            margin-bottom: 30px; 
            font-size: 0.95rem; 
        }

        /* 团队生活照片展示网格 */
        .grid-gallery { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px; 
        }

        .gallery-card { 
            background: white; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.04); 
            border: 1px solid #e2e8f0; 
            transition: all 0.3s ease; 
        }
        .gallery-card:hover { 
            transform: translateY(-5px); 
            border-color: var(--secondary); 
            box-shadow: 0 8px 25px rgba(30,136,229,0.15); 
        }
        
        .gallery-img-box {
            width: 100%;
            height: 200px;
            overflow: hidden;
            background: #f1f5f9;
        }
        .gallery-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }
        .gallery-card:hover .gallery-img {
            transform: scale(1.05);
        }

        .gallery-info {
            padding: 15px 20px;
        }
        .gallery-title { 
            color: var(--primary); 
            font-size: 1.1rem; 
            margin: 0 0 6px 0; 
            font-weight: 700;
        }
        .gallery-desc { 
            font-size: 0.9rem; 
            color: var(--muted); 
            margin: 0; 
            line-height: 1.5; 
        }

        /* 移动端自适应适配（与其他页面完全一致） */
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                padding: 10px 15px;
            }
            .nav-brand {
                padding: 6px 0;
                font-size: 1.15rem;
            }
            .nav-links {
                width: 100%;
                justify-content: flex-start;
                overflow-x: auto;
                padding-bottom: 5px;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }
            .nav-links::-webkit-scrollbar {
                display: none;
            }
            .nav-links a {
                padding: 8px 10px;
                font-size: 0.86rem;
            }
            .grid-gallery { 
                grid-template-columns: 1fr; 
                gap: 15px;
            }
            .container {
                margin: 15px auto;
                padding: 0 15px;
            }
        }

        footer { text-align: center; padding: 30px 0; margin-top: 60px; background: var(--primary); color: #94a3b8; font-size: 0.85rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">Smart Sensor Group <span></span></a>
            <ul class="nav-links">
                <li><a href="index.html">About</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="research.html">Research</a></li>
                <li><a href="publications.html">Publications</a></li>
                <li><a href="grouplife.html" class="active">Group Life</a></li>
                <li><a href="joinus.html">Join Us</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="section-title">Group Life & Activities</div>
        <p class="section-subtitle">🎉 记录课题组丰富多彩的科研生活、团建活动、学术会议及毕业合影</p>

        <div class="grid-gallery">
            <!-- 活动 1 -->
            <div class="gallery-card">
                <div class="gallery-img-box">
                    <img src="https://via.placeholder.com/600x400/1e88e5/ffffff?text=Team+Building" alt="团建活动" class="gallery-img">
                </div>
                <div class="gallery-info">
                    <h3 class="gallery-title">实验室春季团建活动</h3>
                    <p class="gallery-desc">放松身心，增进团队凝聚力，共创和谐向上的实验室文化。</p>
                </div>
            </div>

            <!-- 活动 2 -->
            <div class="gallery-card">
                <div class="gallery-img-box">
                    <img src="https://via.placeholder.com/600x400/0f2c59/ffffff?text=Academic+Conference" alt="学术会议" class="gallery-img">
                </div>
                <div class="gallery-info">
                    <h3 class="gallery-title">参加国内外学术会议</h3>
                    <p class="gallery-desc">积极参与学术交流，汇报最新研究成果，拓宽国际视野。</p>
                </div>
            </div>

            <!-- 活动 3 -->
            <div class="gallery-card">
                <div class="gallery-img-box">
                    <img src="https://via.placeholder.com/600x400/00bcd4/ffffff?text=Graduation+Group+Photo" alt="毕业合影" class="gallery-img">
                </div>
                <div class="gallery-info">
                    <h3 class="gallery-title">毕业季欢送与合影</h3>
                    <p class="gallery-desc">祝贺毕业生前程似锦，开启人生崭新华章，常回实验室看看。</p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 Smart Sensor Group</p>
    </footer>
</body>
</html>
