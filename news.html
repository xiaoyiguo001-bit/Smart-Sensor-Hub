<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News | Smart Sensor Group</title>
    <style>
        :root { 
            --primary: #0f2c59; 
            --secondary: #1e88e5; 
            --accent: #00bcd4; 
            --bg: #f4f7fb; 
            --text: #1e293b; 
            --muted: #64748b; 
        }
        
        * { box-sizing: border-box; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            margin: 0; 
            background: var(--bg); 
            color: var(--text); 
            line-height: 1.6; 
        }
        
        .navbar { 
            background: var(--primary); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
        }
        .nav-container { 
            max-width: 1100px; 
            margin: 0 auto; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 20px; 
        }
        .nav-brand { 
            font-size: 1.25rem; 
            font-weight: 700; 
            color: white; 
            text-decoration: none; 
            padding: 16px 0; 
        }
        .nav-brand span { color: var(--accent); }
        .nav-links { 
            display: flex; 
            gap: 5px; 
            list-style: none; 
            margin: 0; 
            padding: 0; 
        }
        .nav-links a { 
            color: #cbd5e1; 
            text-decoration: none; 
            padding: 18px 14px; 
            display: block; 
            font-weight: 500; 
            font-size: 0.95rem; 
            border-bottom: 3px solid transparent; 
            white-space: nowrap;
        }
        .nav-links a:hover { color: white; }
        .nav-links a.active { 
            color: white; 
            border-bottom-color: var(--accent); 
            background: rgba(255,255,255,0.08); 
        }

        .container { 
            max-width: 1100px; 
            margin: 30px auto; 
            padding: 0 20px; 
            min-height: 75vh; 
        }

        .section-title { 
            font-size: 1.35rem; 
            color: var(--primary); 
            border-left: 4px solid var(--secondary); 
            padding-left: 10px; 
            margin-bottom: 20px; 
            font-weight: 700; 
        }

        .card { 
            background: white; 
            border-radius: 12px; 
            padding: 30px 35px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); 
            border: 1px solid #e2e8f0; 
            margin-bottom: 30px; 
        }

        .news-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .news-item {
            padding: 16px 0;
            border-bottom: 1px dashed #cbd5e1;
            display: flex;
            gap: 15px;
            align-items: baseline;
        }
        .news-item:last-child { border-bottom: none; }

        .news-date {
            font-weight: 700;
            color: var(--secondary);
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .news-content {
            font-size: 0.95rem;
            color: #334155;
        }

        @media (max-width: 768px) {
            .nav-container { flex-direction: column; padding: 10px 15px; }
            .nav-brand { padding: 8px 0; font-size: 1.15rem; }
            .nav-links { width: 100%; justify-content: space-around; overflow-x: auto; padding-bottom: 5px; -webkit-overflow-scrolling: touch; }
            .nav-links a { padding: 8px 10px; font-size: 0.88rem; }
            .container { margin: 15px auto; padding: 0 12px; }
            .card { padding: 20px 18px; }
            .news-item { flex-direction: column; gap: 4px; }
        }
        
        footer { text-align: center; padding: 25px 0; margin-top: 40px; background: var(--primary); color: #94a3b8; font-size: 0.85rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">Smart Sensor Group <span></span></a>
            <ul class="nav-links">
                <li><a href="index.html">About</a></li>
                <li><a href="news.html" class="active">News</a></li>
                <li><a href="research.html">Research</a></li>
                <li><a href="publications.html">Publications</a></li>
                <li><a href="joinus.html">Join Us</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="section-title">最新动态 (News & Events)</div>
        <div class="card">
            <ul class="news-list">
                <li class="news-item">
                    <span class="news-date">[2026.01]</span>
                    <span class="news-content">热烈祝贺课题组关于智能传感芯片的最新研究成果被行业顶级期刊接收。</span>
                </li>
                <li class="news-item">
                    <span class="news-date">[2025.11]</span>
                    <span class="news-content">课题组研究生在国际顶级会议（MEMS 2026 / ISSCC 等）发表口头报告。</span>
                </li>
                <li class="news-item">
                    <span class="news-date">[2025.09]</span>
                    <span class="news-content">欢迎 2025 级研究生、博士生正式加入 Smart Sensor Group 课题组！</span>
                </li>
            </ul>
        </div>
    </div>

    <footer>
        <p>© 2026 Smart Sensor Group</p>
    </footer>
</body>
</html>
